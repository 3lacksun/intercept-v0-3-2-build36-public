name: Build 36 launch-fix APK

on:
  workflow_dispatch:

env:
  EXPECTED_TEXTSRC_SHA256: d012e8478fcdc9e62e69161e157f63f0830537d0aaf84cee6a9c7055628573c6
  TEXTSRC_URL: https://litter.catbox.moe/1ku4z2.tgz
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process
    -Dkotlin.incremental=false
    -Dfile.encoding=UTF-8
    -Xmx4g
    -XX:MaxMetaspaceSize=1536m
    -XX:+UseSerialGC

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct text-only source tree
        run: |
          set -euo pipefail
          mkdir -p src evidence
          echo "Downloading SHA-pinned textsrc pack"
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/textsrc.tgz "$TEXTSRC_URL"
          ACTUAL=$(sha256sum /tmp/textsrc.tgz | awk '{print $1}')
          echo "$ACTUAL" | tee evidence/textsrc.sha256
          test "$ACTUAL" = "$EXPECTED_TEXTSRC_SHA256"
          tar -xzf /tmp/textsrc.tgz -C src
          test -f src/gradlew
          test -f src/app/src/main/java/com/nexarenew/aiconsole/data/AppDatabase.kt
          grep -F 'const val SCHEMA_VERSION = 19' src/app/src/main/java/com/nexarenew/aiconsole/data/AppDatabase.kt
          grep -F 'versionCode = 36' src/app/build.gradle.kts

      - name: Harden boot path against same-version schema drift
        run: |
          set -euo pipefail
          python3 tools/harden_boot.py
          python3 tools/samsung_safe.py
          grep -F 'Configuration.Provider' src/app/src/main/java/com/nexarenew/aiconsole/KotlinCommandApp.kt
          grep -F 'WorkManagerInitializer' src/app/src/main/AndroidManifest.xml
          grep -F 'Theme.DeviceDefault.Light.NoActionBar' src/app/src/main/res/values/themes.xml
          grep -F 'fun onOpen' src/app/src/main/java/com/nexarenew/aiconsole/data/AppDatabase.kt
          grep -F 'fun onDowngrade' src/app/src/main/java/com/nexarenew/aiconsole/data/AppDatabase.kt
          grep -F 'tableExists' src/app/src/main/java/com/nexarenew/aiconsole/data/AppDatabase.kt
          grep -F 'Database open/heal failed' src/app/src/main/java/com/nexarenew/aiconsole/KotlinCommandApp.kt
          grep -F 'inputData.getBoolean(KEY_EXPLICIT, false)' src/app/src/main/java/com/nexarenew/aiconsole/tasks/OutboxRetryWorker.kt
          grep -F 'painterResource(R.drawable.ic_intercept_foreground)' src/app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt
          grep -F '@drawable/ic_intercept_foreground' src/app/src/main/res/values-v31/themes.xml
          grep -F '@color/stone_lab_white' src/app/src/main/res/drawable/intercept_launch_background.xml
          if grep -F '@mipmap/ic_launcher' src/app/src/main/res/drawable/intercept_launch_background.xml; then
            echo 'launch background still references adaptive mipmap' >&2
            exit 1
          fi

      - name: Restore Gradle wrapper jar and launcher icons
        run: |
          set -euo pipefail
          mkdir -p src/gradle/wrapper
          curl --fail --location --retry 3 -o src/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          test -s src/gradle/wrapper/gradle-wrapper.jar
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          def png(w,h,rgb):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag+data) & 0xffffffff)
              raw = b''.join(b'\x00' + (bytes(rgb)*w) for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w,h,8,2,0,0,0)) + chunk(b'IDAT', zlib.compress(raw,9)) + chunk(b'IEND', b'')
          root = Path('src/app/src/main/res')
          (root/'drawable-nodpi').mkdir(parents=True, exist_ok=True)
          (root/'drawable-nodpi'/'stone_brand_mark.png').write_bytes(png(192,192,(20,24,32)))
          for name, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              d = root/name
              d.mkdir(parents=True, exist_ok=True)
              (d/'ic_launcher.png').write_bytes(png(size,size,(196,154,74)))
              (d/'ic_launcher_round.png').write_bytes(png(size,size,(196,154,74)))
          print('generated placeholder icons')
          PY
          chmod +x src/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Install Android API 36 and Build Tools 36
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties

      - name: Prepare Gradle
        working-directory: src
        run: |
          set -euo pipefail
          {
            echo org.gradle.daemon=false
            echo org.gradle.parallel=false
            echo org.gradle.workers.max=2
            echo org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseSerialGC -Dfile.encoding=UTF-8
            echo kotlin.compiler.execution.strategy=in-process
            echo kotlin.incremental=false
          } >> gradle.properties
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt

      - name: Assemble debug APK
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug | tee ../evidence/assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify package identity
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt"
          if [ ! -x "$AAPT" ]; then AAPT="$BT/aapt2"; fi
          "$AAPT" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='36' versionName='0.3.2'" evidence/aapt-badging.txt
          grep -F "sdkVersion:'26'" evidence/aapt-badging.txt
          grep -F "targetSdkVersion:'36'" evidence/aapt-badging.txt
          "$BT/zipalign" -c -v 4 "$APK" | tee evidence/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256
          cp "$APK" evidence/INTERCEPT_V0_3_2_BUILD36_DEBUG.apk

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_2_BUILD36_LAUNCH_FIX_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_2_BUILD36_DEBUG_APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
